name: gest-prospect

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gest-prospect-app
    environment:
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY:-}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-dev-only-change-me}"
      APP_PORT: "${APP_PORT:-8003}"
      APP_URL: "${APP_URL:-http://localhost:8003}"
      DJANGO_DEBUG: "${DJANGO_DEBUG:-false}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      DJANGO_CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8003}"
      DJANGO_SECURE_SSL_REDIRECT: "${DJANGO_SECURE_SSL_REDIRECT:-false}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-2}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-60}"
      DATABASE_PATH: /app/data/db.sqlite3
      DB_NAME: "${DB_NAME:-neondb}"
      DB_USER: "${DB_USER:-neondb_owner}"
      DB_PASSWORD: "${DB_PASSWORD:-}"
      DB_HOST: "${DB_HOST:-}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_SCHEMA: "${DB_SCHEMA:-}"
      DB_SSLMODE: "${DB_SSLMODE:-require}"
      DB_CHANNEL_BINDING: "${DB_CHANNEL_BINDING:-require}"
      DB_CONNECT_TIMEOUT: "${DB_CONNECT_TIMEOUT:-10}"
      DB_CONN_MAX_AGE: "${DB_CONN_MAX_AGE:-60}"
    ports:
      - "${APP_PORT:-8003}:${APP_PORT:-8003}"
    volumes:
      - django_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('APP_PORT', '8003') + '/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  django_data:
